services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering?sslmode=disable
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_COMMANDS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_COMMANDS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      OIDC_ISSUER: http://localhost:8081/realms/wagering
      OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      HTTP_ADDRESS: :8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.19.1
    command:
      - -path=/migrations
      - -database=postgres://wagering:wagering@postgres:5432/wagering?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null && awslocal sqs get-queue-url --queue-name wager-transactions-dlq.fifo >/dev/null && awslocal sqs get-queue-url --queue-name wager-events.fifo >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /realms/wagering HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  postgres_data:
